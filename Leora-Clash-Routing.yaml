mode: rule
ipv6: true
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  inet6-address:
  - fdfe:dcba:9876::1/126
  dns-hijack:
  - any:53
  - tcp://any:53
  route-exclude-address:
  - 100.64.0.0/10
  - fd7a:115c:a1e0::/48
dns:
  enable: true
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.ts.net
  - +.tongji.edu.cn
  - +.tsinghua.edu.cn
  - +.pku.edu.cn
  - +.fudan.edu.cn
  - +.sjtu.edu.cn
  - +.buaa.edu.cn
  nameserver-policy:
    +.ts.net: udp://100.100.100.100#DIRECT
    +.tongji.edu.cn: udp://202.120.190.208#DIRECT
    +.tsinghua.edu.cn: udp://166.111.8.28#DIRECT
    +.pku.edu.cn: udp://162.105.129.122#DIRECT
    +.fudan.edu.cn: udp://202.120.224.26#DIRECT
    +.sjtu.edu.cn: udp://202.120.2.100#DIRECT
    +.buaa.edu.cn: udp://202.112.128.51#DIRECT
  default-nameserver:
  - 223.5.5.5
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  nameserver:
  - https://1.1.1.1/dns-query#PROXY
  - https://1.0.0.1/dns-query#PROXY
rule-providers:
  leora-00:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Tonhie/Leora-ProxyRules/refs/heads/main/providers/leora-00.yaml
    path: ./ruleset/leora-00.yaml
    interval: 86400
  leora-01:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
    path: ./ruleset/leora-01.text
    interval: 86400
  leora-02:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Tonhie/Leora-ProxyRules/refs/heads/main/providers/leora-02.yaml
    path: ./ruleset/leora-02.yaml
    interval: 86400
  leora-03:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Tonhie/Leora-ProxyRules/refs/heads/main/providers/leora-03.yaml
    path: ./ruleset/leora-03.yaml
    interval: 86400
rules:
- DOMAIN-SUFFIX,ts.net,DIRECT
- DOMAIN-SUFFIX,tongji.edu.cn,DIRECT
- DOMAIN-SUFFIX,tsinghua.edu.cn,DIRECT
- DOMAIN-SUFFIX,pku.edu.cn,DIRECT
- DOMAIN-SUFFIX,fudan.edu.cn,DIRECT
- DOMAIN-SUFFIX,sjtu.edu.cn,DIRECT
- DOMAIN-SUFFIX,buaa.edu.cn,DIRECT
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
- IP-CIDR6,fd7a:115c:a1e0::/48,DIRECT,no-resolve
- RULE-SET,leora-00,REJECT
- RULE-SET,leora-01,REJECT
- RULE-SET,leora-02,REJECT
- RULE-SET,leora-03,REJECT
- NETWORK,udp,PROXY
- NETWORK,udp,REJECT
- DOMAIN-SUFFIX,steampowered.com,PROXY
- DOMAIN-SUFFIX,steamcommunity.com,PROXY
- DOMAIN-SUFFIX,steamstatic.com,PROXY
- DOMAIN-SUFFIX,steamchina.com,PROXY
- DOMAIN-SUFFIX,steamstore-a.akamaihd.net,PROXY
- AND,((NETWORK,tcp),(DST-PORT,80/443),(DOMAIN,dl.steam.clngaa.com)),DIRECT
- AND,((NETWORK,tcp),(DST-PORT,80/443),(DOMAIN,dl.steam.ksyna.com)),DIRECT
- AND,((NETWORK,tcp),(DST-PORT,80/443),(DOMAIN,st.dl.bscstorage.net)),DIRECT
- AND,((NETWORK,tcp),(DST-PORT,80/443),(DOMAIN,st.dl.eccdnx.com)),DIRECT
- AND,((NETWORK,tcp),(DST-PORT,80/443),(DOMAIN,st.dl.pinyuncloud.com)),DIRECT
- AND,((NETWORK,tcp),(DST-PORT,80/443),(DOMAIN,steampipe.steamcontent.tnkjmec.com)),DIRECT
- AND,((NETWORK,tcp),(DST-PORT,80/443),(DOMAIN,steampowered.com.8686c.com)),DIRECT
- AND,((NETWORK,tcp),(DST-PORT,80/443),(DOMAIN,steamstatic.com.8686c.com)),DIRECT
- AND,((NETWORK,tcp),(DST-PORT,80/443),(DOMAIN,xz.pphimalayanrt.com)),DIRECT
- AND,((NETWORK,tcp),(DST-PORT,80/443),(DOMAIN,cdn-ali.content.steamchina.com)),DIRECT
- AND,((NETWORK,tcp),(DST-PORT,80/443),(DOMAIN,cdn-qc.content.steamchina.com)),DIRECT
- AND,((NETWORK,tcp),(DST-PORT,80/443),(DOMAIN,cdn-ws.content.steamchina.com)),DIRECT
- AND,((NETWORK,tcp),(DST-PORT,80/443),(DOMAIN-SUFFIX,steamcontent.com)),DIRECT
- MATCH,PROXY
