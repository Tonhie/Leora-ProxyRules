name: Refresh Leora rules
on:
  workflow_dispatch:
  push:
    paths:
      - Leora-ProxyRules.conf
      - build_rules.py
      - .github/workflows/build-rules.yml
permissions:
  contents: write
concurrency:
  group: leora-rule-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build from remote sources
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: python build_rules.py --base "https://raw.githubusercontent.com/$REPOSITORY/refs/heads/$REF_NAME"
      - name: Commit refreshed files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Leora-Clash-Routing.yaml Leora-Clash-DNS.yaml Leora-Xray-Routing.json providers conversion-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh converted Leora rules"
            git push
          fi
