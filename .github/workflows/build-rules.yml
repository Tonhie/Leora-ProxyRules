name: Refresh Leora rules
on:
  workflow_dispatch:
  push:
    paths:
      - Leora-ProxyRules.conf
      - build_rules.py
      - merge_mihomo.py
      - merge_xray.py
      - routing_policy.py
      - tests/**
      - browser/**
      - .github/workflows/build-rules.yml
permissions:
  contents: write
concurrency:
  group: leora-rule-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build from remote sources
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: python build_rules.py --base "https://raw.githubusercontent.com/$REPOSITORY/refs/heads/$REF_NAME"
      - name: Validate General/Host parity, generated profiles and merge tools
        run: python -m unittest discover -s tests -v
      - name: Download checksum-verified cores
        run: python tests/fetch_cores.py "$RUNNER_TEMP/leora-cores"
      - name: Validate complete generated profiles with both cores
        run: python tests/verify_profiles.py --mihomo "$RUNNER_TEMP/leora-cores/mihomo" --xray "$RUNNER_TEMP/leora-cores/xray"
      - name: Verify routing and STUN transport guards
        run: python tests/verify_cores.py --mihomo "$RUNNER_TEMP/leora-cores/mihomo" --xray "$RUNNER_TEMP/leora-cores/xray"
      - name: Verify split DNS has no public fallback
        run: python tests/verify_dns.py --mihomo "$RUNNER_TEMP/leora-cores/mihomo" --xray "$RUNNER_TEMP/leora-cores/xray"
      - name: Verify public DNS proxy and failure paths
        run: python tests/verify_privacy.py --mihomo "$RUNNER_TEMP/leora-cores/mihomo" --xray "$RUNNER_TEMP/leora-cores/xray"
      - name: Commit refreshed files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Leora-Clash-Routing.yaml Leora-Xray-Routing.json providers conversion-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh converted Leora rules"
            git push
          fi
